{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">
            {% if perfil %}Editar{% else %}Cadastrar{% endif %} {{ tipo|title }}
        </h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700">Primeiro Nome</label>
                    <input type="text" name="first_name" value="{{ perfil.usuario.first_name|default:'' }}" required class="w-full mt-1 border border-gray-300 rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Sobrenome</label>
                    <input type="text" name="last_name" value="{{ perfil.usuario.last_name|default:'' }}" required class="w-full mt-1 border border-gray-300 rounded-lg p-2.5">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700">Email (Usado para Login)</label>
                    <input type="email" name="email" value="{{ perfil.usuario.email|default:'' }}" required class="w-full mt-1 border border-gray-300 rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">CPF</label>
                    <input type="text" name="cpf" value="{{ perfil.cpf|default:'' }}" maxlength="11" required class="w-full mt-1 border border-gray-300 rounded-lg p-2.5">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700">
                        Senha {% if perfil %}<span class="text-gray-400 font-normal">(Deixe em branco para manter a atual)</span>{% endif %}
                    </label>
                    <input type="password" name="senha" {% if not perfil %}required{% endif %} minlength="8" class="w-full mt-1 border border-gray-300 rounded-lg p-2.5">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700">
                        Foto de Perfil {% if not perfil %}*{% endif %}
                    </label>
                    <input type="file" name="foto_perfil" accept="image/*" {% if not perfil %}required{% endif %} class="w-full mt-1 border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-200 mt-8">
                <a href="{% url 'painel_usuarios' %}" class="bg-gray-200 text-gray-800 px-6 py-2.5 rounded-lg font-bold mr-4 hover:bg-gray-300 transition">Cancelar</a>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2.5 rounded-lg font-bold hover:bg-blue-700 transition">
                    Salvar Registro
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
