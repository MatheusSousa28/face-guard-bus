{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FaceGuard Bus - Login</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center font-sans py-8 px-4 relative overflow-x-hidden bg-gradient-to-br from-sky-300 via-blue-500 to-blue-900">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden opacity-[.16]">
        <img src="{% static 'img/icone_onibus.png' %}" class="absolute left-[5%] top-[9%] w-20 rotate-[-9deg]" alt="">
        <img src="{% static 'img/icone_familia.png' %}" class="absolute right-[9%] top-[12%] w-24 rotate-[8deg]" alt="">
        <img src="{% static 'img/icone_rota.png' %}" class="absolute left-[13%] top-[57%] w-16 rotate-[12deg]" alt="">
        <img src="{% static 'img/icone_reconhecimento.png' %}" class="absolute right-[12%] top-[58%] w-16 rotate-[-8deg]" alt="">
        <img src="{% static 'img/icone_escola.png' %}" class="absolute left-[25%] bottom-[5%] w-14 rotate-[-6deg]" alt="">
        <img src="{% static 'img/icone_onibus.png' %}" class="absolute right-[30%] bottom-[4%] w-20 rotate-[7deg]" alt="">
        <img src="{% static 'img/icone_familia.png' %}" class="absolute left-[34%] top-[4%] w-16 rotate-[4deg]" alt="">
        <svg class="absolute right-0 top-[28%] h-36 w-36" viewBox="0 0 150 150" fill="none" stroke="black" stroke-width="1.2"><path d="M42 4 4 42M88 4 4 88M134 4 4 134"/></svg>
        <svg class="absolute -left-8 top-[20%] h-40 w-40" viewBox="0 0 160 160" fill="none" stroke="black" stroke-width="1.2"><path d="M-10 55 55-10M-10 85 85-10M-10 115 115-10M-10 145 145-10"/></svg>
        <svg class="absolute -left-6 bottom-[8%] h-28 w-28 rotate-180" viewBox="0 0 120 120" fill="none" stroke="black" stroke-width="1.1"><path d="M-10 45 45-10M-10 70 70-10M-10 95 95-10"/></svg>
    </div>

    <div class="relative z-10 bg-white/95 backdrop-blur p-8 rounded-2xl shadow-2xl ring-1 ring-white/50 w-full max-w-md">
        <img src="{% static 'img/logo_azul.png' %}" alt="FaceGuard Bus" class="mx-auto mb-4 h-auto w-32 sm:w-36 object-contain">
        <h2 class="font-display text-4xl font-bold text-blue-800 mb-6 text-center">Bem vindo!</h2>
        <h2 class= "text-sm font-semibold mt-8 text-center pb-10">Preencha os campos para entrar na sua conta</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
            <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="login-email" type="email" name="email" placeholder="Seu email" required maxlength="254" value="{{ request.POST.email|default:'' }}"
                data-count aria-label="Seu email"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-500">
            <p class="text-right text-xs text-gray-500"><span data-counter>0</span>/254</p>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                
                <div class="relative">
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required maxlength="128"
                        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 pr-10">
                    
                    <button type="button" onclick="toggleSenha('senha', 'eye-senha', 'eye-slash-senha')" 
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 flex items-center">
                        
                        <svg id="eye-senha" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        
                        <svg id="eye-slash-senha" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" disabled
                    class="submit-button font-display w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 px-4 rounded transition duration-200 disabled:cursor-not-allowed disabled:opacity-50">
                <span class="button-label">Entrar</span>
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Não tem uma conta? <a href="{% url 'cadastro' %}" class="text-blue-600 hover:underline font-medium">Cadastre-se</a></p>
        </div>
    </div>
    {% if messages %}<div class="fixed bottom-5 left-1/2 z-[100] flex w-[calc(100%-2rem)] max-w-md -translate-x-1/2 flex-col items-center gap-2">{% for message in messages %}<div class="toast-message w-full rounded-lg px-5 py-3 text-center text-sm font-semibold text-white shadow-xl {% if message.tags == 'error' %}bg-red-600{% elif 'pending' in message.tags %}bg-green-600{% else %}bg-blue-600{% endif %}">{{ message }}</div>{% endfor %}</div>{% endif %}
    <script>
        document.querySelectorAll('[data-count]').forEach(input => {
            const counter = input.parentElement.querySelector('[data-counter]');
            const update = () => { if (counter) counter.textContent = input.value.length; };
            input.addEventListener('input', () => { input.value = input.value.replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}]/gu, ''); update(); }); update();
        });
        const loginForm = document.querySelector('form');
        const loginButton = loginForm.querySelector('[type="submit"]');
        const loginInputs = [...loginForm.querySelectorAll('input[required]')];
        const updateLoginButton = () => { loginButton.disabled = !loginInputs.every(input => input.value.trim() && input.validity.valid); };
        loginInputs.forEach(input => input.addEventListener('input', updateLoginButton)); updateLoginButton();
        loginForm.addEventListener('submit', event => {
            if (!loginForm.checkValidity()) { event.preventDefault(); return; }
            loginButton.disabled = true;
            loginButton.querySelector('.button-label').innerHTML = '<span class="inline-flex items-center gap-2"><span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>Entrando...</span>';
        });
        document.querySelectorAll('.toast-message').forEach((toast, index) => {
            setTimeout(() => toast.classList.add('transition-all', 'duration-500', 'opacity-0', 'translate-y-3'), 4000 + index * 100);
            setTimeout(() => toast.remove(), 4500 + index * 100);
        });
        function toggleSenha(inputId, eyeId, eyeSlashId) {
            const input = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeId);
            const eyeSlashIcon = document.getElementById(eyeSlashId);

            if (input.type === "password") {
                input.type = "text";
                eyeIcon.classList.add("hidden"); // Esconde o olho aberto
                eyeSlashIcon.classList.remove("hidden"); // Mostra o olho com risco
            } else {
                input.type = "password";
                eyeIcon.classList.remove("hidden");
                eyeSlashIcon.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
